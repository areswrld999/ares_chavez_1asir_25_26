<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        //Proceso

        function Proceso (){
            let sw = 0
            let suma = 0
            while (sw == 0){
                let numero = parseInt(prompt("Ingrese numero"))
                if (numero == 0){
                    sw = 1
                }
                else {
                    suma += numero
                }
            }
            return suma
        }

        function Visualizar (resul){
            document.write(resul)
        }

        // Programa Principal
        Visualizar(Proceso())
    </script>
</body>
</html>
