<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Proceso(){
            let sw = 0
            while(sw == 0){
                let numero = parseInt(prompt("Ingrese Numero"))
                if(numero == 0){
                    sw = 1
                }
                else if (numero < 0){
                    negativos++
                }
                else if (numero > 0){
                    positivos++
                }
            }
            return positivos,negativos
        }

        function Visualizar (){
            document.write("Hay " + negativos + " numeros negativos. Y hay " + positivos + " numeros positivos")
        }

        //Programa Principal
        let positivos = 0
        let negativos = 0
        Visualizar(Proceso())
    </script>
</body>
</html>
