    <script>

        function Proceso (tab_numero){
            let salir = 0, i=0, ordenado = "si";
            while (salir == 0){
                if (i < tab_numero.length){
                    salir = 1
                } else {
                    if (tab_numero[i]> tab_numero[i+1]){
                        ordenado="no"
                        salir = 1
                    } else {
                        i++
                    }
                }
            }
            return ordenado;
